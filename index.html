<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la mejor Gymrat</title>
    <style>
        /* Fondo oscuro estilo gimnasio/noche */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Lienzo del corazón */
        svg {
            width: 250px;
            height: 250px;
            overflow: visible;
        }

        /* Efecto de construcción (dibujando el corazón) */
        .heart-path {
            fill: transparent;
            stroke: #ff2a5f;
            stroke-width: 4;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            stroke-linecap: round;
            /* La animación dibuja la línea en 3s, luego empieza el latido y el llenado */
            animation: drawHeart 3s ease-in-out forwards, 
                       pumpHeart 1s infinite alternate 3.5s;
        }

        /* Animación 1: Construcción (el calentamiento) */
        @keyframes drawHeart {
            0% { stroke-dashoffset: 300; }
            100% { stroke-dashoffset: 0; }
        }

        /* Animación 2: Latido pesado (el pump) */
        @keyframes pumpHeart {
            0% { 
                transform: scale(1) translateY(0); 
                fill: transparent; 
                filter: drop-shadow(0 0 0px #ff2a5f);
            }
            50% {
                fill: #ff2a5f;
            }
            100% { 
                transform: scale(1.15) translateY(-5px); 
                fill: #ff2a5f; 
                filter: drop-shadow(0 0 25px #ff2a5f); /* Glow rojizo */
                stroke-width: 0;
            }
        }

        /* Estilo de los textos */
        .message-box {
            opacity: 0;
            margin-top: 30px;
            animation: fadeIn 2s ease forwards 4s;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff2a5f;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.2rem;
            color: #b3b3b3;
            margin: 5px 0;
            font-weight: 300;
        }

        .highlight {
            color: #fff;
            font-weight: bold;
        }

        /* Animación de entrada para el texto */
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(-10px); }
        }

        /* Decoración de pesas flotantes */
        .dumbbell {
            display: inline-block;
            font-size: 2.5rem;
            animation: lift 1.5s infinite alternate ease-in-out;
        }

        .d-left { animation-delay: 0s; margin-right: 15px;}
        .d-right { animation-delay: 0.75s; margin-left: 15px;}

        @keyframes lift {
            0% { transform: translateY(5px); }
            100% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Figura SVG del Corazón -->
        <svg viewBox="0 0 100 100">
            <path class="heart-path" 
                  d="M 50,85 C 50,85 15,55 15,30 C 15,15 30,10 40,20 C 50,30 50,30 50,30 C 50,30 50,30 60,20 C 70,10 85,15 85,30 C 85,55 50,85 50,85 Z" />
        </svg>

        <!-- Mensaje que aparece después -->
        <div class="message-box">
            <h1>
                <span class="dumbbell d-left">🏋🏻‍♀️</span> 
                Para la más hermosa 
                <span class="dumbbell d-right">🏋🏻‍♀️</span>
            </h1>
            <p>Haces que mi corazón lata más rápido que el <span class="highlight">pre-entreno</span>.</p>
            <p>Mi mejor <span class="highlight">PR</span> fue haberte conocido.</p>
        </div>
    </div>

</body>
</html>
